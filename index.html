<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roblox Avatar Viewer</title>
  <style>
    :root{
      --card-bg: rgba(15, 23, 36, 0.65);
      --accent:#2563eb;
      --danger:#f87171;
      --muted:#9aa4bf;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      color: #fff;
      background: url("background.avif") no-repeat center center fixed;
      background-size: cover;
    }

    /* blurry overlay to soften background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p.lead { margin-bottom: 18px; color: var(--muted); }

    .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3);
      color: white;
      font-size: 15px;
      outline: none;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }

    .meta { margin-top: 14px; min-height: 20px; }
    .error { color: var(--danger); font-weight: 600; }

    .avatar-wrap { margin-top: 18px; display: flex; justify-content: center; }
    img.avatar {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.2);
      display: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 600;
    }

    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.06);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { margin-top: 16px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Roblox Avatar Viewer</h1>
    <p class="lead">Type a Roblox username, hit the button, and their avatar headshot will appear.</p>

    <div class="row">
      <input id="username" type="text" placeholder="e.g. builderman" autocomplete="off" />
      <button id="goBtn">Get Avatar</button>
    </div>

    <div class="meta" id="meta"></div>

    <div class="avatar-wrap">
      <img id="avatarImg" class="avatar" alt="Roblox avatar headshot" width="260" height="260" />
    </div>

    <footer>lelandgamer12346 | Roblox Avatar Getter</footer>
  </main>

  <script>
    const usernameInput = document.getElementById('username');
    const goBtn = document.getElementById('goBtn');
    const meta = document.getElementById('meta');
    const avatarImg = document.getElementById('avatarImg');

    async function showError(msg){
      meta.innerHTML = '<span class="error">'+escapeHtml(msg)+'</span>';
      avatarImg.style.display = 'none';
      avatarImg.src = '';
    }

    function setLoading(on, text = 'Loading…'){
      if(on){
        meta.innerHTML = '<span class="loading"><span class="spinner"></span>' + escapeHtml(text) + '</span>';
        goBtn.disabled = true;
      } else {
        goBtn.disabled = false;
        if(!meta.querySelector('.error')) meta.innerHTML = '';
      }
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function fetchUserId(username){
      const url = `https://users.roblox.com/v1/usernames/users?username=${encodeURIComponent(username)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('User fetch failed');
      const data = await res.json();
      return data.data?.[0]?.id || null;
    }

    async function fetchAvatarUrl(userId){
      const url = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('Avatar fetch failed');
      const data = await res.json();
      return data.data?.[0]?.imageUrl || null;
    }

    async function getAvatar(){
      const username = usernameInput.value.trim();
      if(!username) return showError('Enter a username.');

      setLoading(true, 'Looking up user…');
      try {
        const userId = await fetchUserId(username);
        if(!userId) {
          showError('Couldn’t find that user.');
          setLoading(false);
          return;
        }

        setLoading(true, 'Fetching avatar…');
        const avatarUrl = await fetchAvatarUrl(userId);
        if(!avatarUrl){
          showError('Couldn’t load avatar');
          setLoading(false);
          return;
        }

        avatarImg.src = avatarUrl;
        avatarImg.onload = () => {
          avatarImg.style.display = 'block';
          meta.textContent = `User ID: ${userId} — Username: ${username}`;
          setLoading(false);
        };
        avatarImg.onerror = () => {
          showError('Image load failed');
          setLoading(false);
        };

      } catch (err) {
        console.error(err);
        showError('Network or CORS error. Try using a local server.');
        setLoading(false);
      }
    }

    goBtn.addEventListener('click', getAvatar);
    usernameInput.addEventListener('keydown', e => { if(e.key === 'Enter') getAvatar(); });
  </script>
</body>
</html>
